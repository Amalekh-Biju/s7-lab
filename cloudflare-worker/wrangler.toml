name = "s7-lab-ai-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# Free-tier lightweight model default (falls back automatically to 3.1-flash-lite -> 2.5-flash -> gemma-4):
GEMINI_MODEL = "gemini-3.5-flash-lite"
GROQ_MODEL = "llama-3.3-70b-versatile"

# Built-in Cloudflare Workers AI fallback (works with zero external API keys!)
[ai]
binding = "AI"

# Set your external API key securely via terminal:
# npx wrangler secret put GEMINI_API_KEY
# npx wrangler secret put GROQ_API_KEY
